<section class="container mx-auto py-8">
  <h2 class="text-2xl font-semibold mb-6">Productos</h2>

  <!-- Lista de productos -->
  @if (loading()) {
    <div>Cargando productos...</div>
  } @else {
    @if (productList().length === 0) {
      <div>No hay productos.</div>
    } @else {
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        @for (p of productList(); track p.id) {
          <div class="border rounded p-3 flex flex-col">
            @if (p.images?.length) {
              <img
              [src]="p.images?.[0] | imageUrl"
              class="mb-2 h-36 object-cover rounded"
            />
            } @else {
              <div class="mb-2 h-36 bg-gray-200 flex items-center justify-center rounded text-sm text-gray-500"
              >Sin imagen</div>
            }


            <div class="flex-1">
              <div class="font-medium py-2">{{ p.name }}</div>
              <div class="text-lg font-bold text-primary mt-1 py-2">
                {{ p.price | currency }}
              </div>
            </div>

            <div class="flex gap-2 mt-2 py-2">
              <button
                class="flex-1 py-1 bg-yellow-500 text-white rounded"
                (click)="editProduct(p.id)"
              >
                Editar
              </button>
              <button
                class="flex-1 py-1 bg-red-500 text-white rounded"
                (click)="deleteProduct(p.id)"
              >
                Eliminar
              </button>
            </div>
          </div>
        }
      </div>
    }
  }
</section>
