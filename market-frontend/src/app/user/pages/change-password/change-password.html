<div class="flex justify-center items-center min-h-screen bg-gray-50 p-6">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
    <h2 class="text-2xl font-bold mb-6 text-center">Cambiar Contraseña</h2>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">

      <!-- Contraseña actual -->
      <div>
        <label class="block text-sm font-medium">Contraseña actual</label>
        <input type="password" formControlName="currentPassword"
          class="w-full p-2 mt-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-400">
      </div>

      <!-- Nueva contraseña -->
      <div>
        <label class="block text-sm font-medium">Nueva contraseña</label>
        <input type="password" formControlName="newPassword"
          class="w-full p-2 mt-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-400">
        @if (form.invalid && form.touched) {
        <div class="text-red-500 text-sm">
            Revisa los campos antes de continuar
        </div>
        }   
      </div>

      <!-- Confirmar nueva contraseña -->
      <div>
        <label class="block text-sm font-medium">Confirmar nueva contraseña</label>
        <input type="password" formControlName="confirmPassword"
          class="w-full p-2 mt-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-400">
      </div>

      <button type="submit"
        class="w-full p-2 bg-indigo-600 text-white rounded flex items-center justify-center gap-2">
        Cambiar Contraseña
      </button>
    </form>
  </div>
</div>
