<section class="container mx-auto py-8">
      <h2 class="text-2xl font-semibold mb-4">Checkout</h2>

      @if (cart.items().length === 0) {
        <p>El carrito está vacío.</p>
      } @else {
        <div class="bg-white rounded p-6 shadow">
          <div class="mb-4">
            <h3 class="font-medium">Resumen</h3>
            @for (it of cart.items(); track it.product.id) {
              <div class="flex justify-between mt-2">
                <div>{{ it.product.name }} x{{ it.quantity }}</div>
                <div>{{ (it.product.price * it.quantity) | currency }}</div>
              </div>
              }
            <div class="mt-4 text-right font-bold">Total: {{ cart.subtotal() | currency }}</div>
          </div>

          <div class="flex gap-2 justify-end">
            <button (click)="placeOrder()" class="px-4 py-2 bg-indigo-600 text-white rounded">Pagar</button>
          </div>
        </div>
      }
</section>
