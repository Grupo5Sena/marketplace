<nav class="bg-white shadow-sm">
  <div class="flex items-center justify-between p-4">

    <!-- Izquierda: Logo -->
    <a routerLink="/" class="flex items-center gap-2 text-xl font-bold text-indigo-600">
      <span class="material-symbols-outlined">storefront</span>
      MyMarketplace
    </a>

    <!-- Buscador -->
    <div class="flex-1 mx-8 max-w-lg relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-600">search</span>
      <input
        type="text"
        placeholder="Buscar productos..."
        class="w-full form-input max-w-md rounded-lg border-gray-300 dark:border-gray-400 bg-gray-100 dark:bg-gray-300 focus:ring-primary focus:border-primary pl-10 pr-4 py-2"
      />
    </div>

    <!-- Derecha: Menú y carrito -->
    <div class="flex items-center gap-6">

      <!-- Categorías dropdown -->
      <div class="relative group">
        <button class="flex items-center gap-1 text-gray-600 hover:text-indigo-600">
          Categorías
          <span class="material-symbols-outlined text-sm">arrow_drop_down_circle</span>
        </button>
        <div
          class="absolute left-0 mt-2 w-64 bg-white border rounded-lg shadow-lg
                  opacity-0 group-hover:opacity-100 pointer-events-none
                  group-hover:pointer-events-auto transition"
        >
          <ul class="p-2 text-sm max-h-72 overflow-y-auto">
            <li>
              <button
                class="w-full text-left px-3 py-2 rounded hover:bg-indigo-50"
                [class.bg-indigo-100]="!categoryId()"
                [class.font-semibold]="!categoryId()"          
                (click)="categoryId.set(null)"
              >
                Todas
              </button>
            </li>

            @for (c of categories.list(); track c.id) {
              <li>
                <button
                  class="w-full text-left px-3 py-2 rounded hover:bg-indigo-50"
                  [class.bg-indigo-100]="categoryId() === c.id"
                  [class.font-semibold]="categoryId() === c.id"
                  (click)="categoryId.set(c.id)"
                >
                  {{ c.name }}
                </button>
              </li>
            }
          </ul>
        </div>
      </div>   

      <div>
        <a routerLink="/offers" class="text-gray-600 hover:text-indigo-600">
            Ofertas
          </a>
      </div>

      <div class="flex items-center gap-4">
        @if (isLoggedIn()) {
        <app-user-summary/>          
        } @else {
          <div class="flex items-center gap-4">
            <a routerLink="/login" class="hover:underline">Login</a>
            <a routerLink="/register" class="hover:underline">Registrar</a>
          </div>
        }
              
        <a routerLink="/cart" class="relative flex items-center justify-center rounded-lg h-10 w-10 bg-gray-100 dark:bg-gray-500 text-gray-300 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700">
          <span class="material-symbols-outlined">shopping_cart</span>
          @if (items().length > 0) {
            <span
              class="absolute -top-2 -right-3 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white rounded-full bg-red-600"
            >
              {{ items().length }}
            </span>
          }
        </a>             
      </div>        
    </div>
  </div>
</nav>
