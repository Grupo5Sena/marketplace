@if (isLoggedIn()) {
  <div class="relative group flex items-center gap-3">

    <!-- Avatar -->
    <img
      [src]="user()?.avatar | imageUrl"
      alt="Avatar"
      class="rounded-full size-10 object-cover border cursor-pointer"
    />

    <!-- Nombre -->
    <a
      class="font-semibold text-gray-800 hover:text-blue-600"
    >
      {{ user()?.name }}
    </a>

    <!-- Dropdown -->
    <div
      class="
        absolute right-0 top-12 w-48 bg-white border rounded shadow-lg
        opacity-0 invisible
        group-hover:opacity-100 group-hover:visible
        transition-all duration-150
        z-50
      "
    >
      <a
        routerLink="/user/profile"
        class="block px-4 py-2 text-sm hover:bg-gray-100"
      >
        Mi perfil
      </a>

      <button
        (click)="logout()"
        class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
      >
        Cerrar sesión
      </button>
    </div>

  </div>
}
